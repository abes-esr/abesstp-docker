# activer le mode étendu globalement
ExtendedStatus On
Listen 8080
<VirtualHost *:8080>
    <IfModule mod_status.c>
        <Location /server-status>
            SetHandler server-status
            Require ip 10.34 193.52.26
            Require local
        </Location>
    </IfModule>
	DocumentRoot /var/www/server-status
</VirtualHost>
